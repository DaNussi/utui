[package]
authors = ["Daniel Nussbaum <info@daniel-nussbaum.at>"]
edition = "2021"
name = "utui"
description = "A simple Rust project using Nix"
version = "0.1.0"


[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
ratatui = { version = "0.30.2", features = ["all-widgets", "serde"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["serde", "event-stream"] }
serde = "1.0.229"
hyprland = { git = "https://github.com/hyprland-community/hyprland-rs", branch = "master" }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-serde = "0.2.0"
futures = "0.3.33"
nf-icons = "0.1.0"
chrono = "0.4.45"
ratatui-interact = "0.5.3"
home-config = { version = "0.7.0", features = ["json"] }
anyhow = "1.0.104"
stylix = { path = "../stylix-rs" }

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
overflow-checks = true
